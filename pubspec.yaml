name: greennote
description: "GreenNote is an independent Coolapk client."
publish_to: 'none'
version: 1.8.12+144

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bcrypt: ^1.2.0
  crypto: ^3.0.6
  dio: ^5.7.0
  extended_image: 8.3.1
  easy_refresh: 3.5.1
  dynamic_color: ^1.9.0
  flutter_riverpod: ^2.5.1
  html: ^0.15.7
  shared_preferences: ^2.3.2
  flutter_secure_storage: 11.2.0
  path_provider: ^2.1.2
  url_launcher: 6.3.3
  video_player: ^2.9.2
  liquid_glass_widgets:
    path: packages/liquid_glass_widgets
  webview_flutter: ^4.14.1
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  shaders:
    - shaders/gallery_glass_button.frag
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: assets/greennote_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/greennote_icon.png
  adaptive_icon_foreground_inset: 16
